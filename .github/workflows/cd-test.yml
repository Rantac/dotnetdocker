name: CD Pipeline 

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: build

    - name: Deploy to Pre-production
      run: echo "Deploying to pre-production..." # Replace this with actual deploy commands

    - name: Deploy to Production (manual trigger)
      if: ${{ github.ref == 'refs/heads/main' }} # Optionally, limit it to main branch
      run: echo "Deploying to production..." # Replace this with actual deploy commands
      env:
        ENV: production
